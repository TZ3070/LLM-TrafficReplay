services:
  dashboard:
    build:
      context: .
      args:
        # 认证模式必须同时进入构建产物（前端行为）与运行环境（nginx 注入），两处取同一变量避免漂移。
        # proxy 模式构建所需的 BENCHMARK_API_KEY 校验由 Dockerfile 内置占位值满足，无需在此传入真实密钥。
        VITE_REPLAY_AUTH_MODE: ${VITE_REPLAY_AUTH_MODE:-manual}
        VITE_PROMETHEUS_SCRAPE_INTERVAL_SECONDS: ${VITE_PROMETHEUS_SCRAPE_INTERVAL_SECONDS:-15}
        VITE_REPLAY_LATENCY_WINDOW_SECONDS: ${VITE_REPLAY_LATENCY_WINDOW_SECONDS:-60}
        VITE_REPLAY_CACHE_CONFIG: ${VITE_REPLAY_CACHE_CONFIG:-}
    image: llm-dashboard
    environment:
      # 看板指标后端，必填；只填协议+IP+端口，不追加 /api。
      BACKEND_URL: ${BACKEND_URL:?请在 .env 中配置 BACKEND_URL（看板指标后端地址）}
      # 独立 Benchmark 回放后端；留空则回放请求回落 BACKEND_URL。
      REPLAY_BACKEND_URL: ${REPLAY_BACKEND_URL:-}
      # 回放路径前缀；须与前端构建使用的回放路由前缀一致，默认 /api/replays。
      REPLAY_PATH_PREFIX: ${REPLAY_PATH_PREFIX:-/api/replays}
      # 与 build args 同源；proxy 模式须配置 BENCHMARK_API_KEY。
      VITE_REPLAY_AUTH_MODE: ${VITE_REPLAY_AUTH_MODE:-manual}
      BENCHMARK_API_KEY: ${BENCHMARK_API_KEY:-}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped
    # 健康检查只探测本容器静态页；后端连通性用 curl /health 单独验证。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
